<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Kanban Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#e7e5dc; --surface:#f3efe5; --surface-strong:#fffdf6; --text:#1f2526; --dim:#616866; --border:#c7c6bd;
  --accent:#e66a2c; --accent-ink:#29140a; --graphite:#1f2526; --sage:#71886f; --brass:#a67f35; --blue:#668195;
  --radius:10px; --shadow:0 2px 0 rgb(31 37 38 / .14), 0 8px 18px rgb(31 37 38 / .08);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111515; --surface:#252a29; --surface-strong:#303533; --text:#f3efe5; --dim:#b2b7b2; --border:#454b49; --accent:#ef814b; --accent-ink:#160b06; --graphite:#eff0e9; --sage:#91a58e; --brass:#c2a465; --blue:#89a9bd; --shadow:0 2px 0 rgb(0 0 0 / .3), 0 10px 22px rgb(0 0 0 / .2); }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{color:inherit}
button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2rem}
.app-shell{min-height:100vh;background:linear-gradient(rgb(31 37 38 / .035) 1px, transparent 1px),var(--bg);background-size:100% 32px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1560px;margin:0 auto;padding:28px 16px 56px}
.board-intro{display:flex;flex-direction:column;align-items:flex-start;gap:20px;margin-bottom:24px}
.intro-line{margin:0 0 4px;color:var(--accent);font-family:"IBM Plex Sans Condensed","Aptos Narrow",sans-serif;font-size:14px;font-weight:750;letter-spacing:.03em}
.board-intro h1{margin:0;font-family:"IBM Plex Sans Condensed","Aptos Narrow",sans-serif;font-size:clamp(32px,8vw,54px);line-height:.98;letter-spacing:-.035em}
.intro-copy{max-width:520px;margin:9px 0 0;color:var(--dim);font-size:15px}
.new-project-button,.primary-button{min-height:46px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;box-shadow:0 3px 0 color-mix(in srgb, var(--accent) 65%, black);cursor:pointer}
.new-project-button{padding:0 17px;white-space:nowrap}
.new-project-button span{font-size:20px;vertical-align:-1px}
.new-project-button:active,.primary-button:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb, var(--accent) 65%, black)}
.progress-rail{display:grid;grid-template-columns:repeat(5,1fr);margin-bottom:24px;background:var(--graphite);border-radius:var(--radius);overflow:hidden}
.rail-stop{position:relative;display:flex;align-items:center;justify-content:space-between;min-width:0;padding:11px 13px 10px 17px;color:var(--bg);text-decoration:none;font-family:"IBM Plex Sans Condensed","Aptos Narrow",sans-serif;font-size:13px;font-weight:700;min-height:44px}
.rail-stop:not(:last-child)::after{content:"";position:absolute;right:0;top:9px;bottom:9px;width:1px;background:color-mix(in srgb, var(--bg) 24%, transparent)}
.rail-stop::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tone)}
.rail-stop strong{margin-left:5px;font-size:16px}
.tone-slate{--tone:#7b8380}.tone-orange{--tone:var(--accent)}.tone-brass{--tone:var(--brass)}.tone-blue{--tone:var(--blue)}.tone-sage{--tone:var(--sage)}
.kanban-grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.kanban-column{min-width:0;scroll-margin-top:18px;border-top:4px solid var(--tone);border-radius:6px 6px 0 0;transition:background-color 120ms ease, outline-color 120ms ease}
.kanban-column.drag-target{background:color-mix(in srgb, var(--tone) 14%, transparent);outline:2px dashed var(--tone);outline-offset:5px}
.column-heading{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:7px 4px 8px}
.column-heading>div{display:flex;align-items:center;gap:8px;min-width:0}
.column-heading h2{margin:0;font-family:"IBM Plex Sans Condensed","Aptos Narrow",sans-serif;font-size:19px;line-height:1;letter-spacing:-.015em}
.status-mark{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:var(--tone)}
.count-badge{display:grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:11px;background:color-mix(in srgb, var(--tone) 15%, var(--surface));color:var(--text);font-size:12px;font-weight:800}
.column-add,.icon-button{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--text);font-size:22px;cursor:pointer}
.column-add:hover,.icon-button:hover{background:var(--surface-strong);border-color:var(--tone,var(--text))}
.card-stack{display:grid;gap:10px}
.project-card{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;min-height:92px;padding:14px 12px 13px 10px;background:var(--surface);border:1px solid color-mix(in srgb, var(--border) 80%, var(--tone));border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer}
.project-card::after{content:"";position:absolute;inset:0 0 auto;height:2px;border-radius:var(--radius) var(--radius) 0 0;background:var(--tone);opacity:.85}
.project-card:hover{background:var(--surface-strong)}
.project-card:focus-within{outline:2px solid var(--tone);outline-offset:2px}
.project-card.is-dragging{opacity:.38}
.drag-handle{display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;width:22px;height:38px;min-height:38px;margin-top:-2px;padding:0;border:0;background:transparent;cursor:grab;touch-action:none}
.drag-handle:active{cursor:grabbing}
.drag-handle span{width:13px;height:2px;background:var(--dim);border-radius:2px;display:block}
.card-copy{min-width:0}
.card-copy h3{margin:0;font-size:15px;line-height:1.3;font-weight:780;overflow-wrap:anywhere}
.card-copy p{margin:7px 0 0;color:var(--dim);font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.edit-card{align-self:end;padding:8px 4px;min-height:36px;border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;cursor:pointer}
.edit-card:hover{color:var(--accent)}
.empty-column{min-height:66px;border:1px dashed var(--border);border-radius:var(--radius);background:transparent;color:var(--dim);cursor:pointer;width:100%}
.empty-column:hover{border-color:var(--tone);color:var(--text)}
.drag-ghost{position:fixed;z-index:80;max-width:260px;padding:11px 13px;pointer-events:none;border:1px solid var(--accent);border-radius:8px;background:var(--surface-strong);box-shadow:0 18px 40px rgb(0 0 0 / .25);transform:rotate(1.5deg)}
.drag-ghost strong{display:block;font-size:14px}
.drag-ghost span{display:block;margin-top:3px;color:var(--dim);font-size:11px}
.modal-backdrop{position:fixed;z-index:100;inset:0;display:grid;align-items:end;padding:16px;background:rgb(17 21 21 / .68)}
.modal-sheet{width:min(100%,560px);max-height:calc(100dvh - 32px);overflow:auto;margin:0 auto;padding:21px;border:1px solid var(--border);border-radius:14px 14px 8px 8px;background:var(--surface);box-shadow:0 28px 80px rgb(0 0 0 / .35)}
.modal-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.modal-heading h2{margin:1px 0 0;font-family:"IBM Plex Sans Condensed","Aptos Narrow",sans-serif;font-size:27px;line-height:1.1}
.modal-kicker{margin:0;color:var(--accent);font-size:12px;font-weight:800}
.card-form{display:grid;gap:7px;margin-top:22px}
.card-form label{margin-top:8px;font-size:13px;font-weight:760}
.card-form input,.card-form textarea,.card-form select{width:100%;border:1px solid var(--border);border-radius:7px;background:var(--surface-strong);color:var(--text);outline:0}
.card-form input,.card-form select{min-height:46px;padding:0 12px}
.card-form textarea{resize:vertical;min-height:116px;padding:11px 12px}
.card-form input:focus,.card-form textarea:focus,.card-form select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
.modal-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px}
.save-actions{display:flex;gap:9px}
.primary-button,.secondary-button,.danger-button,.text-button{min-height:42px;padding:0 14px;cursor:pointer}
.primary-button{min-width:80px}
.primary-button:disabled{opacity:.55;cursor:default}
.secondary-button{border:1px solid var(--border);border-radius:7px;background:transparent}
.text-button{border:0;background:transparent;font-size:13px;font-weight:700}
.danger-text,.form-error{color:#bd3b2d}
.danger-button{border:0;border-radius:7px;background:#bd3b2d;color:#fff;font-weight:800}
.delete-confirm{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.delete-confirm span{width:100%;color:var(--dim);font-size:12px}
.form-error{margin:6px 0 0;font-size:13px;font-weight:700}
.page-error{margin:20px 0;padding:18px;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:16px;color:#bd3b2d;font-size:14px}
.page-error button{border:0;background:transparent;color:inherit;font-weight:800;cursor:pointer;min-height:36px;padding:6px 8px}
.toolbar-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tool-button{min-height:38px;padding:0 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface);font-size:13px;font-weight:700;cursor:pointer}
.tool-button:hover{background:var(--surface-strong)}
@media (min-width:680px){main{padding:40px 24px 72px}.board-intro{flex-direction:row;align-items:end;justify-content:space-between}.kanban-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.modal-backdrop{align-items:center}.modal-sheet{border-radius:14px}}
@media (min-width:1120px){main{padding-inline:28px}.kanban-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.project-card{grid-template-columns:18px minmax(0,1fr);padding-right:11px}.edit-card{grid-column:2;justify-self:end;margin-top:-4px}}
@media (max-width:540px){.progress-rail{grid-template-columns:repeat(5,minmax(0,1fr))}.rail-stop{justify-content:center;min-height:52px;padding:8px 4px}.rail-stop span{display:none}.rail-stop strong{margin:0}.modal-actions{align-items:flex-end}.delete-confirm{max-width:150px}}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="app-shell">
  <main>
    <header class="board-intro">
      <div>
        <p class="intro-line" id="introLine">Loading projects…</p>
        <h1>What’s moving?</h1>
        <p class="intro-copy">Drag a card forward, or tap it to change the details.</p>
        <div class="toolbar-row">
          <button type="button" class="tool-button" id="exportBtn">Export board (.json)</button>
          <button type="button" class="tool-button" id="importBtn">Import board</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
      </div>
      <button class="new-project-button" type="button" id="newProjectBtn"><span aria-hidden="true">＋</span> New project</button>
    </header>

    <nav class="progress-rail" aria-label="Project counts by column" id="progressRail"></nav>
    <div id="pageError"></div>
    <div class="kanban-grid" id="boardGrid"></div>
  </main>
</div>
<div id="ghostRoot"></div>
<div id="modalRoot"></div>

<script>
var COLUMNS = [
  {key:"backlog", label:"Backlog", tone:"slate"},
  {key:"todo", label:"To Do", tone:"orange"},
  {key:"in_progress", label:"In Progress", tone:"brass"},
  {key:"waiting", label:"Waiting", tone:"blue"},
  {key:"done", label:"Done", tone:"sage"}
];
var STORAGE_KEY = "kanban-board-static-v2";
var SEED = [
  {id:1,title:"Welcome — tap a card to edit it",notes:"Try dragging this card to another column, or tap Edit to change it.",column:"todo",position:1},
  {id:2,title:"Add your first project",notes:"Use New project or the + in any column.",column:"todo",position:2},
  {id:3,title:"An idea for later",notes:"Backlog is for things you are not starting yet.",column:"backlog",position:1},
  {id:4,title:"Something in progress",notes:"Cards you are actively working on live here.",column:"in_progress",position:1},
  {id:5,title:"Waiting on something",notes:"Park cards here when they are blocked or waiting on a reply.",column:"waiting",position:1},
  {id:6,title:"A finished project",notes:"Done — drag cards here when they are complete.",column:"done",position:1}
];

function loadCards(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return SEED.slice();
    var parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) return SEED.slice();
    return parsed.filter(function(c){ return c && typeof c.title==="string" && COLUMNS.some(function(col){return col.key===c.column;}); });
  }catch(e){ return SEED.slice(); }
}
function saveCards(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); }catch(e){ showError("This browser could not save the board. Try exporting a backup."); } }
function esc(s){ return String(s||"").replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];}); }
function grouped(){
  var r={}; COLUMNS.forEach(function(c){r[c.key]=[];});
  cards.slice().sort(function(a,b){return (a.position||0)-(b.position||0) || a.id-b.id;}).forEach(function(card){ if(r[card.column]) r[card.column].push(card); });
  return r;
}
function nextPos(col){ var g=grouped()[col]||[]; return g.length ? Math.max.apply(null,g.map(function(c){return c.position||0;}))+1 : 1; }
function nextId(){ return cards.length ? Math.max.apply(null,cards.map(function(c){return c.id;}))+1 : 1; }

var cards = loadCards();
var drag = null;
var actionError = null;

function showError(msg){ actionError = msg; renderError(); }
function renderError(){
  var el=document.getElementById("pageError");
  if(!actionError){ el.innerHTML=""; return; }
  el.innerHTML='<div class="page-error" role="alert"><span>'+esc(actionError)+'</span><button type="button" id="dismissErr">Dismiss</button></div>';
  document.getElementById("dismissErr").addEventListener("click",function(){actionError=null;renderError();});
}

function render(){
  var g = grouped();
  var total = cards.length;
  var doneCount = g.done.length;
  document.getElementById("introLine").textContent = (total-doneCount)+" active · "+doneCount+" done";
  // rail
  var rail=document.getElementById("progressRail");
  rail.innerHTML = COLUMNS.map(function(col){
    return '<a href="#column-'+col.key+'" class="rail-stop tone-'+col.tone+'" aria-label="'+esc(col.label)+': '+g[col.key].length+' projects"><span>'+esc(col.label)+'</span><strong>'+g[col.key].length+'</strong></a>';
  }).join("");
  // grid
  var grid=document.getElementById("boardGrid");
  grid.innerHTML = COLUMNS.map(function(col){
    var list=g[col.key];
    var isTarget = drag && drag.target===col.key;
    var cardsHtml = list.map(function(card){
      var dragging = drag && drag.card.id===card.id;
      return '<article class="project-card'+(dragging?' is-dragging':'')+'" data-card-id="'+card.id+'">'
        + '<button type="button" class="drag-handle" data-drag-id="'+card.id+'" aria-label="Drag card" title="Drag to another column"><span></span><span></span><span></span></button>'
        + '<div class="card-copy"><h3>'+esc(card.title)+'</h3>'+(card.notes?'<p>'+esc(card.notes)+'</p>':'')+'</div>'
        + '<button type="button" class="edit-card" data-edit-id="'+card.id+'">Edit</button>'
        + '</article>';
    }).join("");
    if(list.length===0) cardsHtml = '<button type="button" class="empty-column" data-add-col="'+col.key+'">Add the first project</button>';
    return '<section id="column-'+col.key+'" class="kanban-column tone-'+col.tone+(isTarget?' drag-target':'')+'" data-column="'+col.key+'" aria-labelledby="heading-'+col.key+'">'
      + '<div class="column-heading"><div><span class="status-mark" aria-hidden="true"></span><h2 id="heading-'+col.key+'">'+esc(col.label)+'</h2><span class="count-badge">'+list.length+'</span></div>'
      + '<button type="button" class="column-add" data-add-col="'+col.key+'" aria-label="Add project to '+esc(col.label)+'">＋</button></div>'
      + '<div class="card-stack">'+cardsHtml+'</div></section>';
  }).join("");

  // wire events
  grid.querySelectorAll("[data-add-col]").forEach(function(btn){ btn.addEventListener("click",function(){ openModal({mode:"add", column:btn.getAttribute("data-add-col")}); }); });
  grid.querySelectorAll(".project-card").forEach(function(el){
    el.addEventListener("click",function(){
      var id=parseInt(el.getAttribute("data-card-id"),10);
      var card=cards.find(function(c){return c.id===id;});
      if(card) openModal({mode:"edit", card:card});
    });
  });
  grid.querySelectorAll("[data-edit-id]").forEach(function(btn){
    btn.addEventListener("click",function(e){ e.stopPropagation(); var id=parseInt(btn.getAttribute("data-edit-id"),10); var card=cards.find(function(c){return c.id===id;}); if(card) openModal({mode:"edit", card:card}); });
  });
  grid.querySelectorAll("[data-drag-id]").forEach(function(btn){
    btn.addEventListener("click",function(e){ e.stopPropagation(); });
    btn.addEventListener("pointerdown",function(e){ var id=parseInt(btn.getAttribute("data-drag-id"),10); var card=cards.find(function(c){return c.id===id;}); if(card) beginDrag(e,card); });
  });
  renderError();
}

function renderGhost(){
  var root=document.getElementById("ghostRoot");
  if(!drag){ root.innerHTML=""; return; }
  var label = drag.target ? COLUMNS.find(function(c){return c.key===drag.target;}) : null;
  root.innerHTML='<div class="drag-ghost" style="left:'+(drag.x+12)+'px;top:'+(drag.y+12)+'px" aria-hidden="true"><strong>'+esc(drag.card.title)+'</strong><span>'+(label?('Move to '+esc(label.label)):'Drag over a column')+'</span></div>';
}

function beginDrag(event, card){
  event.preventDefault(); event.stopPropagation();
  var pointerId=event.pointerId;
  try{ event.currentTarget.setPointerCapture(pointerId); }catch(e){}
  drag={card:card,x:event.clientX,y:event.clientY,target:null};
  render(); renderGhost();
  function targetAt(x,y){
    var node=document.elementFromPoint(x,y);
    var colEl=node && node.closest ? node.closest("[data-column]") : null;
    var v=colEl ? colEl.getAttribute("data-column") : null;
    return COLUMNS.some(function(c){return c.key===v;}) ? v : null;
  }
  function onMove(me){
    if(me.pointerId!==pointerId) return;
    drag={card:card,x:me.clientX,y:me.clientY,target:targetAt(me.clientX,me.clientY)};
    // update target highlight without full re-render for smoothness: just re-render grid classes
    document.querySelectorAll(".kanban-column").forEach(function(s){ s.classList.toggle("drag-target", s.getAttribute("data-column")===drag.target); });
    renderGhost();
  }
  function onUp(ue){
    if(ue.pointerId!==pointerId) return;
    var target=targetAt(ue.clientX,ue.clientY);
    window.removeEventListener("pointermove",onMove);
    window.removeEventListener("pointerup",onUp);
    window.removeEventListener("pointercancel",onUp);
    drag=null; renderGhost();
    if(target && target!==card.column){
      var c=cards.find(function(x){return x.id===card.id;});
      if(c){ c.column=target; c.position=nextPos(target); saveCards(); }
    }
    render();
  }
  window.addEventListener("pointermove",onMove,{passive:false});
  window.addEventListener("pointerup",onUp);
  window.addEventListener("pointercancel",onUp);
}

// Modal
function openModal(state){
  actionError=null; renderError();
  var isAdd = state.mode==="add";
  var initial = isAdd ? {title:"",notes:"",column:state.column} : {title:state.card.title,notes:state.card.notes||"",column:state.card.column};
  var cardId = isAdd ? null : state.card.id;
  var root=document.getElementById("modalRoot");
  var confirmDelete=false;
  function close(){ root.innerHTML=""; window.removeEventListener("keydown",onKey); }
  function onKey(e){ if(e.key==="Escape") close(); }
  window.addEventListener("keydown",onKey);
  function draw(){
    var options = COLUMNS.map(function(c){ return '<option value="'+c.key+'"'+(initial.column===c.key?' selected':'')+'>'+esc(c.label)+'</option>'; }).join("");
    var deleteHtml="";
    if(!isAdd){
      if(confirmDelete){
        deleteHtml='<div class="delete-confirm"><span>Delete this card?</span><button type="button" class="danger-button" id="confirmDeleteBtn">Delete</button><button type="button" class="text-button" id="keepBtn">Keep</button></div>';
      } else {
        deleteHtml='<button type="button" class="text-button danger-text" id="deleteBtn">Delete card</button>';
      }
    } else { deleteHtml='<span></span>'; }
    root.innerHTML='<div class="modal-backdrop" id="backdrop"><section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="card-dialog-title">'
      +'<div class="modal-heading"><div><p class="modal-kicker">'+(isAdd?'Capture the work':'Project card')+'</p><h2 id="card-dialog-title">'+(isAdd?'Add a project':'Edit project')+'</h2></div>'
      +'<button type="button" class="icon-button" id="closeBtn" aria-label="Close editor">×</button></div>'
      +'<form class="card-form" id="cardForm">'
      +'<label for="card-title">Title</label><input id="card-title" maxlength="160" value="'+esc(initial.title)+'">'
      +'<label for="card-notes">Notes</label><textarea id="card-notes" rows="5" maxlength="2000">'+esc(initial.notes)+'</textarea>'
      +'<label for="card-column">Column</label><select id="card-column">'+options+'</select>'
      +'<div class="modal-actions"><div id="deleteZone">'+deleteHtml+'</div><div class="save-actions"><button type="button" class="secondary-button" id="cancelBtn">Cancel</button><button type="submit" class="primary-button" id="saveBtn">Save</button></div></div>'
      +'</form></section></div>';
    var titleInput=document.getElementById("card-title");
    titleInput.focus();
    document.getElementById("backdrop").addEventListener("mousedown",function(e){ if(e.target===e.currentTarget) close(); });
    document.getElementById("closeBtn").addEventListener("click",close);
    document.getElementById("cancelBtn").addEventListener("click",close);
    var delBtn=document.getElementById("deleteBtn"); if(delBtn) delBtn.addEventListener("click",function(){confirmDelete=true; draw();});
    var keepBtn=document.getElementById("keepBtn"); if(keepBtn) keepBtn.addEventListener("click",function(){confirmDelete=false; draw();});
    var confBtn=document.getElementById("confirmDeleteBtn"); if(confBtn) confBtn.addEventListener("click",function(){ cards=cards.filter(function(c){return c.id!==cardId;}); saveCards(); close(); render(); });
    document.getElementById("cardForm").addEventListener("submit",function(e){
      e.preventDefault();
      var title=document.getElementById("card-title").value.trim();
      var notes=document.getElementById("card-notes").value.trim();
      var col=document.getElementById("card-column").value;
      if(!title) return;
      if(isAdd){
        cards.push({id:nextId(), title:title, notes:notes, column:col, position:nextPos(col)});
      } else {
        var c=cards.find(function(x){return x.id===cardId;});
        if(c){ var changedCol = c.column!==col; c.title=title; c.notes=notes; c.column=col; if(changedCol) c.position=nextPos(col); }
      }
      saveCards(); close(); render();
    });
    // keep save disabled state in sync like original
    var saveBtn=document.getElementById("saveBtn");
    function sync(){ saveBtn.disabled = !titleInput.value.trim(); }
    titleInput.addEventListener("input",sync); sync();
  }
  draw();
}

document.getElementById("newProjectBtn").addEventListener("click",function(){ openModal({mode:"add", column:"todo"}); });
document.getElementById("exportBtn").addEventListener("click",function(){
  var blob=new Blob([JSON.stringify(cards,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download="kanban-board.json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(url);},500);
});
document.getElementById("importBtn").addEventListener("click",function(){ document.getElementById("importFile").click(); });
document.getElementById("importFile").addEventListener("change",function(e){
  var file=e.target.files && e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var parsed=JSON.parse(String(reader.result||""));
      if(!Array.isArray(parsed)) throw new Error("bad");
      var clean=parsed.filter(function(c){return c && typeof c.title==="string" && COLUMNS.some(function(col){return col.key===c.column;});}).map(function(c,i){ return {id: typeof c.id==="number"?c.id:i+1, title:String(c.title).slice(0,160), notes:String(c.notes||"").slice(0,2000), column:c.column, position: typeof c.position==="number"?c.position:i+1}; });
      if(!clean.length) throw new Error("empty");
      cards=clean; saveCards(); render();
    }catch(err){ showError("That file could not be imported as a board."); }
    e.target.value="";
  };
  reader.readAsText(file);
});

// first save of seed so refresh persists
if(!localStorage.getItem(STORAGE_KEY)){ saveCards(); }
render();
</script>
</body>
</html>
